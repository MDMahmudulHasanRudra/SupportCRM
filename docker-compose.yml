# Support CRM — single-host stack. This file alone is the whole deployment, self-contained: no host
# nginx, no separate reverse-proxy container, nothing else to install.
#
# Services: postgres, redis, a one-shot migrate+seed, the API, the worker, web (the console, which
# also proxies /api and /socket.io to the API — see apps/web/nginx.conf), and gowa (the WhatsApp
# gateway). Only web publishes a host port (12000 by default); everything else, the gateway
# included, is reachable exclusively on the compose network.
#
# Do not start a second independent gateway against a paired volume. When running it standalone — do not run both against the same volume, or two systems end up driving one
# WhatsApp account (docs/adr/0001 §12).
#
# PROJECT_SPEC.md §150–151: persistent volumes, health checks, restart policies, env configuration.

services:
  postgres:
    # pgvector's own image rather than plain postgres:16 — same PostgreSQL major version, plus the
    # `vector` extension that Phase 4's knowledge embeddings require. The Phase 1 migration creates
    # the extension conditionally, so a plain image still boots; it just cannot do semantic search.
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # No host port here: reachable only on the compose network. A debug-only localhost binding is
    # added by docker-compose.override.yml, which docker compose loads automatically for a plain
    # `docker compose up` but which a real deployment naming its files explicitly never sees.
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [support_crm_net]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # appendonly keeps in-flight queue state across a restart. Redis is still not a source of truth
    # (PROJECT_SPEC.md §184) — this only avoids re-doing work that Postgres already records.
    command: ["redis-server", "--appendonly", "yes"]
    # No host port for the same reason as postgres above — see docker-compose.override.yml.
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [support_crm_net]

  # One-shot. Applies migrations then seeds; both are idempotent, so this runs on every `up`.
  # Separate from the API so several API replicas never race to migrate the same database.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment: &app_env
      NODE_ENV: ${NODE_ENV:-development}
      TZ: ${TZ:-Asia/Dhaka}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_NAME: ${DATABASE_NAME}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-support-crm}
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY}
      SESSION_COOKIE_SECRET: ${SESSION_COOKIE_SECRET}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      ENABLE_SWAGGER: ${ENABLE_SWAGGER:-true}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-admin}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@example.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-ChangeMe!123}
      # What the gateway is told to POST webhooks to. It must be reachable FROM THE GATEWAY, so
      # inside compose it is the service name — `localhost` there means the gateway itself, and
      # inbound messages would silently never arrive.
      CRM_PUBLIC_URL: ${CRM_PUBLIC_URL:-http://localhost:12000}
      API_BASE_URL: ${API_BASE_URL:-http://api:4000}
      # Uploaded knowledge documents. Backed by the storage_data volume on api and worker; both
      # must agree, because the API writes the file and the worker parses and indexes it.
      STORAGE_LOCAL_PATH: /app/storage
      GOWA_LINK_PREVIEW_HOSTS: ${GOWA_LINK_PREVIEW_HOSTS:-}
      GOWA_BASE_URL: http://gowa:3000
      GOWA_BASIC_AUTH: ${GOWA_BASIC_AUTH}
      GOWA_MANAGED_AUTOMATION_DISABLED: "true"
    command: ["sh", "-c", "node dist/database/migrate.js && node dist/seed.js"]
    networks: [support_crm_net]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    environment:
      <<: *app_env
      RUN_MODE: api
      API_PORT: 4000
    volumes:
      - storage_data:/app/storage
    # No host port: the browser never talks to the API directly, only through the web container's
    # nginx proxy. A debug-only localhost binding is added by docker-compose.override.yml.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/v1/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [support_crm_net]

  # The operator console AND the single public entry point. Its nginx serves the static bundle and
  # proxies /api and /socket.io to the api service on the compose network (apps/web/nginx.conf) — so
  # the browser only ever needs one origin and one port, with no separate reverse-proxy container and
  # nothing to install on the host.
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    ports:
      - "${WEB_PORT:-12000}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks: [support_crm_net]

  # Pinned Go WhatsApp runtime. Legacy OpenWA data remains on its old volume for rollback.
  gowa:
    image: ghcr.io/aldinokemal/go-whatsapp-web-multidevice@sha256:6a213a3434f1d94f98b4ee90ee2c71fa391f715ff31bf00734a6240859fe10ba
    restart: unless-stopped
    command: ["rest"]
    environment:
      APP_PORT: 3000
      APP_BASIC_AUTH: ${GOWA_BASIC_AUTH:?Configure GOWA_BASIC_AUTH in .env}
      APP_OS: Support CRM
      APP_UI_ENABLED: "false"
      APP_UI_AUTO_UPDATE: "false"
      MCP_ENABLED: "false"
      DB_URI: file:storages/whatsapp.db?_foreign_keys=on
      WHATSAPP_AUTO_REPLY: ""
      WHATSAPP_AUTO_MARK_READ: "false"
      WHATSAPP_AUTO_DOWNLOAD_MEDIA: "true"
      WHATSAPP_IGNORE_STATUS_MEDIA: "false"
      WHATSAPP_PRESENCE_ON_CONNECT: unavailable
      WHATSAPP_PRESENCE_PULSE_ENABLED: "false"
      CHATWOOT_ENABLED: "false"
      TZ: ${TZ:-Asia/Dhaka}
    volumes:
      - gowa_data:/app/storages
      - gowa_media:/app/statics
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [support_crm_net]

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    environment:
      <<: *app_env
      RUN_MODE: worker
      WORKER_HEALTH_PORT: 4100
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}
    # The same volume as the API: it writes an uploaded document, the worker parses and indexes it.
    volumes:
      - storage_data:/app/storage
    command: ["node", "dist/worker.js"]
    # No published port: the health endpoint binds to 127.0.0.1 for this container's own probe.
    # Scale with `docker compose up -d --scale worker=3` — the job lock makes that safe.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4100/api/v1/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [support_crm_net]

volumes:
  # Uploaded knowledge documents. Without this the files live in the container's writable layer and
  # are destroyed by the next deploy, leaving indexed chunks pointing at nothing.
  storage_data:
    name: support_crm_storage
  # The WhatsApp gateway's session, database and media. The single most important volume to back
  # up after the database: losing it means re-pairing every WhatsApp account by QR.
  openwa_data:
    name: support_crm_openwa_data
  gowa_data:
    name: support_crm_gowa_data
  gowa_media:
    name: support_crm_gowa_media
  pg_data:
    name: support_crm_pg_data
  redis_data:
    name: support_crm_redis_data

networks:
  support_crm_net:
    driver: bridge
