# Serving the console bundle, and the single public entry point for the whole stack.
#
# The browser cannot resolve Docker service names, so it never talks to `api` directly. Instead this
# container proxies `/api/*` and `/socket.io/*` to the API service on the compose network, and serves
# the console for everything else. That keeps API and console on one origin — same-origin `/api`
# requests, one cookie — without needing a separate reverse-proxy container or anything installed on
# the host.

# Upgrade only on an actual WebSocket handshake; a plain (long-polling) socket.io request must not
# carry a stray "Connection: upgrade" header.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Knowledge document uploads go through this same origin; must be at least the API's configured
    # multer limit (25MB default) or nginx rejects the upload before the API ever sees it.
    client_max_body_size 30m;

    # Compression for the bundle. gzip rather than brotli: nginx:alpine ships it, and it is enough
    # for a console this size.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # The API. Same origin as the console, which is the whole point of proxying here.
    location /api/ {
        # Re-resolve the upstream at request time instead of once at startup.
        #
        # nginx resolves a literal `proxy_pass http://api:4000` exactly once, when the worker starts,
        # and caches that address for the life of the process. Recreating the api container — any
        # `docker compose up -d api`, any deploy — gives it a new address, and nginx goes on dialling
        # the old one: every request 502s with "connect() failed (111: Connection refused)" until
        # nginx itself is restarted. Observed in exactly that way after redeploying the API alone.
        #
        # Putting the host in a variable defers resolution to request time; 127.0.0.11 is Docker's
        # embedded DNS. `$request_uri` is required because a variable in proxy_pass stops nginx
        # appending the matched path itself — without it every route would proxy to `/`.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_backend "api:4000";
        proxy_pass http://$api_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The realtime channel. Needs the upgrade headers; everything else is the same as /api/.
    location /socket.io/ {
        # Same runtime resolution as /api/ — a websocket pinned to a dead address fails silently,
        # which is worse than a 502 because the console simply stops updating.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $ws_backend "api:4000";
        proxy_pass http://$ws_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # The SPA fallback. The console owns /reports, /decisions and the rest — without this, a browser
    # refresh on any of them asks nginx for a file that does not exist and gets a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite emits content-hashed filenames, so these can be cached hard: a new build produces new
    # names rather than new contents at the same name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached: it is the file that names the current asset hashes, and a
    # stale copy points the browser at a bundle that no longer exists after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # A container-local liveness endpoint for the compose healthcheck. Not proxied — this must answer
    # even if the API is briefly down, so the healthcheck reports what it actually means: "the static
    # server is up."
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
